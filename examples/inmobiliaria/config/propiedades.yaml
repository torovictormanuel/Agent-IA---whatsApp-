# config/propiedades.yaml — Catálogo de propiedades (datos de ejemplo, mercado AR)
#
# Convenciones del mercado argentino (ver knowledge/contexto_mercado_ar.md):
#   - ambientes: 2 ambientes = 1 dormitorio + living/comedor (cocina y baño no cuentan)
#   - m2_cubierta / m2_semicubierta / m2_descubierta en vez de un solo "m2"
#   - moneda: ventas casi siempre en USD, alquileres mixtos ARS/USD
#   - expensas: gasto mensual aparte del precio (ordinarias, a cargo del inquilino)
#   - operacion: "venta" | "alquiler"

